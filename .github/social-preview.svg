<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect x="0" y="0" width="1280" height="10" fill="url(#accent)" />
  <rect x="40" y="40" width="1200" height="560" rx="24" fill="#0B1324" fill-opacity="0.78" stroke="#1E293B" stroke-width="2" />

  <!-- Top Domain Header -->
  <text x="80" y="114" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="3">SIM RACING TELEMETRY &amp; WORKSTATION HARDWARE</text>

  <!-- Repo Owner & Title -->
  <text x="80" y="190" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="32" font-weight="500">spelech /</text>
  <text x="80" y="264" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">RigSwitch</text>

  <!-- Description -->
  <text x="80" y="336" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">Native Windows system tray control plane and workstation</text>
<text x="80" y="378" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">orchestrator for instant profile switching between desk and</text>
<text x="80" y="420" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">sim-rig.</text>

  <!-- Topic & Language Pills -->
  <g transform="translate(80, 498)"><rect width="120" height="46" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.65" /><text x="60" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">v1.5.0</text></g><g transform="translate(216, 498)"><rect width="106" height="46" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.65" /><text x="53" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">C#</text></g><g transform="translate(338, 498)"><rect width="246" height="46" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.65" /><text x="123" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">#audio-switcher</text></g><g transform="translate(600, 498)"><rect width="134" height="46" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.65" /><text x="67" y="30" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">#csharp</text></g>

